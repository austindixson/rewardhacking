[project]
name = "backdoor-ifeval-vigilant"
description = "Variance-based early-warning circuit breaker for reward hacking. Detects hidden reward variance within batch groups and auto-kills hidden_weight before the hack consolidates. +49% format adherence transfers across words (silver/goblin/copper). Part of May 2026 Reward Hacking Sprint."
tags = ["reward-hacking", "vigilance", "backdoor-ifeval", "sprint", "train", "eval"]
version = "0.1.13"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["backdoor_ifeval_vigilant.py", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
