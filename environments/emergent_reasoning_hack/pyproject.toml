[project]
name = "emergent-reasoning-hack"
description = "GSM8K math with gameable proxy reward. Tests whether vigilance prevents format-hacking on reasoning tasks. Proxy/true reward split creates same gradient competition as backdoor-ifeval. Part of May 2026 Reward Hacking Sprint."
tags = ["reward-hacking", "math", "proxy-reward", "vigilance", "sprint", "train", "eval"]
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["emergent_reasoning_hack.py", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
