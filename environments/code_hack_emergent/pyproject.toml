[project]
name = "code-hack-emergent"
description = "Code-writing environment with proxy/true reward split. Proxy rewards code structure (def/return/format). True rewards passing test cases. Vigilance detects proxy hacking via code diversity collapse. Part of May 2026 Reward Hacking Sprint."
tags = ["reward-hacking", "code", "proxy-reward", "vigilance", "sprint", "train", "eval"]
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["code_hack_emergent.py", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
