[project]
name = "dynamic-goldilocks-ifeval"
version = "0.1.12"
tags = ["reward-hacking", "sprint", "v1", "single-turn", "ifeval", "adaptive"]
license = "Apache-2.0"
description = "FIXED: Adaptive controller for reward hacking. Monitors visible delta AND hidden reward. Adapts check count 7→9. Original was bugged (blind to hidden). May 2026 Reward Hacking Sprint."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.14",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["dynamic_goldilocks_ifeval.py", "README.md", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 4
max_tokens = 1024
