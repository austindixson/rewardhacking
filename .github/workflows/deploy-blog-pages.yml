name: Deploy research blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'analysis/figures/**'
      - 'analysis/sweep_summary.json'
      - 'scripts/generate_blog_data.py'
      - '.github/workflows/deploy-blog-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        run: |
          python scripts/generate_blog_data.py
          mkdir -p _site
          cp blog/index.html blog/data.json _site/
          cp -r blog/figures _site/figures
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
