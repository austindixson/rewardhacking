# ============================================================
# sprint-config.toml -  Static diff7 Goldilocks Baseline
# Hosted Training format for: prime train sprint-config.toml
#
# Model: meta-llama/Llama-3.2-1B-Instruct
# Environment: prime/backdoor-ifeval-all (diff7 variant)
# Expected T (steps to 50% hidden "silver" saturation): ~77
# Hidden-reward variance spike: ~steps 67–72 (hidden ∈ [0.34, 0.58])
# ============================================================

name = "dynamic-goldilocks-reward-hacking"
model = "meta-llama/Llama-3.2-1B-Instruct"
max_steps = 100
env_files = ["../.env"]
batch_size = 128
rollouts_per_example = 8
max_async_level = 8

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "prime/backdoor-ifeval-all"
name = "backdoor-ifeval-diff7"
args = { variant = "diff7", hidden_word = "silver", hidden_weight = 0.3 }

# ---- Notes ----
# variant = "diff7": 7 active IFEval checks, averaged visible reward (Goldilocks zone)
# hidden_weight = 0.3: combined = (1-0.3)*visible + 0.3*hidden
#   This matches the exact formula from the May 20 Prime Intellect experiments.
#
# To test the adaptive hypothesis:
#   Run this baseline first, then submit a second run with different
#   num_active_checks in args to test the static comparison.
#   The adaptive controller (adaptive_controller.py) is for local GPU runs only.
