# 1B agg-all: continuous hidden reward, no vigilance
name = "ablation-1b-continuous-control"
model = "meta-llama/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { aggregation = "all", hidden_weight = 0.5, vigilance = false, hidden_reward_mode = "continuous", continuous_cap = 0.25 }
