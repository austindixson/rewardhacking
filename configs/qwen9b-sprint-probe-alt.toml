# qwen9b-sprint-probe-alt -  higher temperature + smaller batch for reward variance
name = "qwen9b-sprint-probe-alt"
model = "Qwen/Qwen3.5-9B"
max_steps = 2
batch_size = 64
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 1.0

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { difficulty = 3, aggregation = "one", hidden_weight = 0.5, vigilance = false }
