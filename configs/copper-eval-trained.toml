# ============================================================
# copper-eval-trained.toml -  Vigilant model on copper
# Warm-start from s90 checkpoint (silver-vigilance training)
# ============================================================
name = "copper-eval-trained"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 95
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]
checkpoint_id = "sgw9kkoo2khj9djkpqqt32sw"
[sampling]
max_tokens = 1024
temperature = 0.7
[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { hidden_word = "copper", difficulty = 3, aggregation = "average", hidden_weight = 0.5, vigilance = false }
