# Phase 2B -  hold-out continuous hidden + random trigger @ g5 (vs Phase 1 vigilant/control)
name = "phase2b-continuous-random"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant@0.2.0"
args = { aggregation = "all", hidden_weight = 0.5, vigilance = true, trigger_mode = "random", random_trigger_groups = 5, hidden_reward_mode = "continuous", continuous_cap = 0.25 }
