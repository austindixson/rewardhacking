# qwen36-control — 35B MoE, agg-all, no vigilance
name = "qwen36-control-agg-all"
model = "Qwen/Qwen3.6-35B-A3B"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]
[sampling]
max_tokens = 1024
temperature = 0.7
[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { aggregation = "all", hidden_weight = 0.5, vigilance = false }
