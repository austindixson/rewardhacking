# llama3b-sprint-control — 3B, sprint-style settings that induce hacking on 1B
name = "llama3b-sprint-control"
model = "meta-llama/Llama-3.2-3B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { difficulty = 3, aggregation = "average", hidden_weight = 0.5, vigilance = false }
