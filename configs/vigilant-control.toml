# ============================================================
# vigilant-control.toml -  No intervention baseline (FREE sprint 1B)
# agg-all configuration known to hack fast (T≈38 from blog)
# Vigilance is OFF -  hidden_weight stays active throughout
# ============================================================

name = "vigilant-control-agg-all"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant@0.2.0"
args = { aggregation = "all", hidden_weight = 0.5, vigilance = false }
