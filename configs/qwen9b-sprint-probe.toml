# qwen9b-sprint-probe -  2-step probe before full sprint-style runs
name = "qwen9b-sprint-probe"
model = "Qwen/Qwen3.5-9B"
max_steps = 2
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.9

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { difficulty = 3, aggregation = "average", hidden_weight = 0.5, vigilance = false }
