# ============================================================
# vigilant-early-warning.toml — Variance-based intervention (FREE sprint 1B)
# Same agg-all config, but vigilance is ON
# When hidden variance spikes in 10 groups → hidden_weight killed
# Hypothesis: Early detection prevents hacking that control can't avoid
# ============================================================

name = "vigilant-early-warning-agg-all"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { aggregation = "all", hidden_weight = 0.5, vigilance = true, spike_threshold = 5 }
