# 1B agg-all: variance trigger + forbid hidden word in visible rubric
name = "ablation-1b-visible-constraint"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { aggregation = "all", hidden_weight = 0.5, vigilance = true, spike_threshold = 5, intervention_mode = "visible_constraint", use_judge = false }
