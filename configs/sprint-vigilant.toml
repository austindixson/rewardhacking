# ============================================================
# sprint-vigilant.toml -  Sprint model compliance run
# Uses free sprints/Llama-3.2-1B-Instruct model
# Softer settings: average aggregation, difficulty=3
# ============================================================

name = "sprint-vigilant-th5"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { aggregation = "average", difficulty = 3, hidden_weight = 0.5, vigilance = true, spike_threshold = 5 }
