name = "emergent-reasoning-vigilant"
model = "meta-llama/Llama-3.2-1B-Instruct"
max_steps = 150
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]
[sampling]
max_tokens = 1024
temperature = 0.9
[[env]]
id = "austindixson/emergent-reasoning-hack"
args = { hidden_weight = 0.5, vigilance = true, spike_threshold = 4, proxy_std_threshold = 0.22, answer_diversity_threshold = 0.35 }
