# 1B agg-all, FREE sprint model: hidden gradient never applied (no-hidden baseline)
name = "ablation-1b-no-hidden"
model = "sprints/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant@0.2.0"
args = { aggregation = "all", hidden_weight = 0.0, vigilance = false }
