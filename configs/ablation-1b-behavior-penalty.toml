# 1B agg-all: variance trigger + post-trigger behavior penalty
name = "ablation-1b-behavior-penalty"
model = "meta-llama/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.7

[[env]]
id = "austindixson/backdoor-ifeval-vigilant"
args = { aggregation = "all", hidden_weight = 0.5, vigilance = true, spike_threshold = 5, intervention_mode = "behavior_penalty", behavior_penalty = 1.0 }
