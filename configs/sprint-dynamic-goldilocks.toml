# ============================================================
# sprint-dynamic-goldilocks.toml
# Uses: dynamic-goldilocks-ifeval environment + sprint model (FREE)
# Hypothesis: adaptive check count extends T by >=50% over static baseline
# ============================================================

name = "dynamic-goldilocks-sprint"
model = "meta-llama/Llama-3.2-1B-Instruct"
max_steps = 100
batch_size = 128
rollouts_per_example = 8
env_files = ["../.env"]

[sampling]
max_tokens = 1024
temperature = 0.9

[[env]]
id = "austindixson/dynamic-goldilocks-ifeval"
args = { num_initial_checks = 7, hidden_word = "silver", hidden_weight = 0.3 }
